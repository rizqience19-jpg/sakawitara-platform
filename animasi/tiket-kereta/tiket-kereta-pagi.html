<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15221d">
<title>Tiket Kereta Pagi</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#15221d;color:#fdfbef}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:12px;background:#15221d}
main{width:min(100%,445px,calc((100svh - 110px)*0.5625));min-width:min(240px,100%);margin:auto}
figure{margin:0;overflow:hidden;border-radius:18px;background:#000;box-shadow:0 14px 45px #0008}
canvas{width:100%;aspect-ratio:9/16;display:block}
.controls{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;margin-top:12px}
.controls button{border:0;cursor:pointer;color:inherit;font:inherit;border-radius:20px;background:#2a3358;height:36px;min-width:42px;font-size:16px}
input[type=range]{width:100%;accent-color:#d2e4a2;margin:0}
.meta{display:flex;justify-content:space-between;gap:10px;color:#b9bdd0;font-size:12px;margin:8px 1px 0;font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:3px solid #edc86b;outline-offset:3px}
</style>
</head>
<body>
<main aria-label="Pemutar animasi Tiket Kereta Pagi">
<figure><canvas id="screen" width="450" height="800" role="img" aria-label="Animasi kartun drama: Tiket Kereta Pagi"></canvas></figure>
<div class="controls"><button id="play" type="button" aria-label="Putar">▶</button><input id="seek" type="range" min="0" max="100" step=".05" value="0" aria-label="Posisi pemutaran dalam detik"></div>
<div class="meta"><span id="section">—</span><span><span id="now">0:00</span> / <span id="end">0:00</span></span></div>
<audio id="voice" preload="auto" src="output/tiket-kereta-pagi-audio.wav"></audio>
</main>
<script>
'use strict';
// "Tiket Kereta Pagi" — gaya Mbah Darmi: satu narator, caption satu kata, tokoh kepala bulat.
const W=450,H=800;
const canvas=document.querySelector('#screen'),g=canvas.getContext('2d');
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const mix=(a,b,t)=>a+(b-a)*t,wave=v=>Math.sin(v);
function random(i){const n=Math.sin(i*127.1+311.7)*43758.5453;return n-Math.floor(n)}
function at(x,y,s,paint,angle=0){g.save();g.translate(x,y);g.rotate(angle);g.scale(s,s);paint();g.restore()}
function polygon(points,fill,stroke=null,w=1){
  g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=fill;g.fill();
  if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}
}
function ellipse(x,y,rx,ry,fill,angle=0){if(rx<=0||ry<=0)return;g.beginPath();g.ellipse(x,y,rx,ry,angle,0,TAU);g.fillStyle=fill;g.fill()}
function line(points,color,w=2){g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=color;g.lineWidth=w;g.stroke()}
function curve(x,y,cx,cy,ex,ey,color,w=2){g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(cx,cy,ex,ey);g.strokeStyle=color;g.lineWidth=w;g.stroke()}
function box(x,y,w,h,r,color){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=color;g.fill()}
function gradient(x,y,x2,y2,stops){const gr=g.createLinearGradient(x,y,x2,y2);stops.forEach(([p,c])=>gr.addColorStop(p,c));return gr}
function orb(x,y,rx,ry,light,mid,dark){
  g.save();g.translate(x,y);g.scale(rx,ry);
  const gr=g.createRadialGradient(-.38,-.52,.05,.04,.08,1.16);
  gr.addColorStop(0,light);gr.addColorStop(.64,mid);gr.addColorStop(1,dark);
  ellipse(0,0,1,1,gr);g.restore()
}
function label(txt,x,y,size,color,align='center',weight=700){g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.font=weight+' '+size+'px system-ui, sans-serif';g.fillText(txt,x,y)}
function glow(x,y,r,col){const z=g.createRadialGradient(x,y,0,x,y,r);z.addColorStop(0,col);z.addColorStop(1,'rgba(255,231,149,0)');ellipse(x,y,r,r,z)}
function sparkle(x,y,r,alpha=1){
  g.save();g.globalAlpha=clamp(alpha);g.translate(x,y);
  polygon([[0,-r],[r*.22,-r*.22],[r,0],[r*.22,r*.22],[0,r],[-r*.22,r*.22],[-r,0],[-r*.22,-r*.22]],'#fff6cf');g.restore()
}
function pill(txt,x,y,size=13,bg='#fff4d6',fg='#4a3524'){
  g.font='800 '+size+'px system-ui, sans-serif';const w=g.measureText(txt).width+size*1.4;
  box(x-w/2,y-size*.95,w,size*1.9,size,bg);label(txt,x,y+1,size,fg,'center',800)
}

// ---------- Lingkungan ----------
const PAL={
  day:{sky:['#4fb0e2','#b8e2ea','#ffe4a8'],hills:['#7fb868','#62a052','#4a8844'],water:['#b2dca6','#93d0bf','#62b3ad'],grass:['#3a8a3a','#57a83a'],dike:['#9cc65a','#5f9a44'],bank:['#abc46e','#d9d79c','#c1a675','#a78a64'],soil:['#b69468','#946c4d']},
  dry:{sky:['#5aa6d6','#b6d8e4','#ffd99a'],hills:['#b89c58','#9b8444','#7f6e38'],water:['#e0b06a','#c88a4c','#a8683a'],grass:['#b0852e','#d0a43c'],dike:['#d2a860','#a87a3e'],bank:['#d9ae5e','#f0cf8a','#c8924f','#9e6a3a'],soil:['#cf9558','#a86a3a']},
  night:{sky:['#0a1433','#1b2b5e','#3a4a86'],hills:['#26385e','#1f3352','#1a2c45'],water:['#2c5680','#244c72','#1c3f60'],grass:['#2a6e50','#3a8460'],dike:['#3d7a54','#2a5c42'],bank:['#4a7c4c','#62784a','#5a4630','#433322'],soil:['#6e4a30','#4a3020']},
  dusk:{sky:['#e48a66','#f2b98a','#ffdca6'],hills:['#ad8875','#8c8366','#6e7c5b'],water:['#e5bf9c','#d6b69c','#aaa89a'],grass:['#5e8546','#77984a'],dike:['#a3a56a','#7d8e55'],bank:['#abb96e','#d9cf9c','#c1a675','#a78a64'],soil:['#b69468','#946c4d']}
};
function house(x,y,s,mode){
  const night=mode==='night';
  at(x,y,s,()=>{
    ellipse(4,4,84,9,'#41593540');
    polygon([[-64,-70],[48,-70],[48,0],[-64,0]],night?'#6f6c5c':'#ddc9a3');
    polygon([[48,-70],[71,-81],[71,-10],[48,0]],night?'#56604f':'#a79c7d');
    for(const xx of [-61,-22,20,46])line([[xx,-67],[xx,0]],night?'#4f3a2e':'#76533e',3);
    box(-52,-52,19,25,1,night?'#ffd98a':'#eed997');line([[-43,-51],[-43,-28]],'#997654',2);
    box(3,-51,19,24,1,night?'#ffd27a':'#eed997');line([[12,-51],[12,-28]],'#997654',2);
    box(-19,-46,18,46,1,'#426956');ellipse(-6,-21,1.2,1.2,'#f8e7a8');
    polygon([[-79,-68],[-39,-110],[38,-110],[58,-69]],night?'#6f3c3c':'#b75c43');
    polygon([[38,-110],[78,-80],[58,-69]],night?'#562f33':'#924731');
    for(let n=1;n<5;n++){const f=n/5;line([[mix(-39,-79,f),mix(-110,-68,f)],[mix(38,58,f),mix(-110,-69,f)]],'#84433277',1)}
    line([[-79,-68],[58,-69],[78,-80]],'#704838',4)
  })
}
function tree(x,y,s,mode){
  const c=mode==='night'?['#3a5c52','#2d5048','#21403a']:mode==='dry'?['#b8ad66','#958d4c','#6e6b3d']:['#87ad61','#5f904b','#376646'];
  at(x,y,s,()=>{
    line([[2,1],[-1,-48],[0,-103]],mode==='night'?'#3e3d3a':'#79614d',12);
    line([[-1,-47],[-25,-77],[-42,-91]],'#685741',6);line([[-1,-52],[21,-77],[38,-89]],'#685741',6);
    for(const [xx,yy,r] of [[-38,-94,34],[22,-105,37],[0,-122,43],[-15,-101,29],[44,-91,24]])orb(xx,yy,r,r*.83,...c)
  })
}
function sky(t,mode){
  const P=PAL[mode];
  g.fillStyle=gradient(0,-80,0,420,[[0,P.sky[0]],[.65,P.sky[1]],[1,P.sky[2]]]);g.fillRect(-250,-300,950,1200);
  if(mode==='night'){
    for(let i=0;i<46;i++){const a=.45+.55*Math.abs(wave(t*1.3+i));ellipse(random(i)*600-70,random(90+i)*230-40,1.1,1.1,'rgba(255,246,220,'+a.toFixed(2)+')')}
    glow(324,128,110,'#fff3c26a');ellipse(324,128,26,26,'#fff3d2');
    ellipse(316,121,5,4,'#e8dcb8');ellipse(333,136,4,3.4,'#e8dcb8');ellipse(329,116,2.6,2.2,'#e8dcb8')
  }else if(mode==='dry'){
    glow(324,128,150,'#fff2a4b8');ellipse(324,128,31,31,'#fff6c4')
  }else if(mode==='dusk'){
    glow(300,262,140,'#ffd38fa8');ellipse(300,262,34,34,'#ffc77a')
  }else{
    glow(324,128,75,'#fff5b7a8');ellipse(324,128,21,21,'#ffefb6')
  }
  if(mode==='day'||mode==='dusk'){
    for(let i=0;i<4;i++){const x=i*146-45+wave(t*.05+i)*9,y=62+random(i+40)*89;
      for(let j=0;j<3;j++)ellipse(x+j*14,y-j%2*4,21-j*3,7+j,'#fff3d888')}
  }
  for(let i=0;i<3;i++){
    const y=245+i*37;g.beginPath();g.moveTo(-240,y+60);
    for(let x=-240;x<740;x+=5){const z=y-44*wave(x*.011+.7*i)-54*wave(x*.021+i*.65);g.lineTo(x,z)}
    g.lineTo(740,450);g.lineTo(-240,450);g.closePath();g.fillStyle=P.hills[i];g.fill()
  }
  for(const [x,y,s] of [[-13,323,.58],[99,303,.48],[404,326,.72],[323,306,.41]])house(x,y,s,mode);
  for(const [x,y,s] of [[27,330,.66],[211,312,.46],[460,327,.7],[-42,325,.72]])tree(x,y,s,mode)
}
function grass(x,y,s,t,col){
  const lean=wave(t*1.2+x*.042)*1.8*s;
  for(let j=-1;j<=1;j++){const k=6+random(j+x)*5;polygon([[x+j*s,y],[x+j*4*s+lean,y-k*s],[x+(j+1.9)*s,y]],j===1?col[1]:col[0])}
}
function bank(top,bottom,mode){
  const b=PAL[mode].bank;
  polygon([[-250,top],[700,top],[700,bottom],[-250,bottom]],gradient(0,top,0,bottom,[[0,b[0]],[.16,b[1]],[.23,b[2]],[1,b[3]]]));
  for(let i=0;i<52;i++){const x=random(i+11)*780-160,y=mix(top+3,bottom-2,random(i+86));ellipse(x,y,2+.9*random(i),.7,'#5c5c3e40')}
}
function cracks(n,x0,x1,y0,y1,seed=0){
  for(let i=0;i<n;i++){
    const x=mix(x0,x1,random(i+31+seed)),y=mix(y0,y1,random(i+11+seed)),s=.6+(y-y0)/(y1-y0+1)*1.4;
    line([[x,y],[x-6*s,y+4*s],[x+5*s,y+9*s],[x-1*s,y+16*s]],'#6a3e1eb0',1.4*s);
    line([[x+5*s,y+9*s],[x+15*s,y+6*s]],'#6e523880',1*s)
  }
}
function fields(t,mode='day',soil=false){
  sky(t,mode);const P=PAL[mode];
  if(mode==='dry'){
    g.fillStyle=gradient(0,318,0,850,[[0,'#e8bf78'],[.5,'#d29a58'],[1,'#ad6f3c']]);g.fillRect(-240,319,940,650);
    cracks(70,-60,520,330,800,3);
    for(let row=0;row<15;row++){const f=row/14,y=326+f*f*540,s=.35+1.7*f;
      for(let j=-5;j<31;j++){if(random(row*31+j)>.22)continue;const x=(j-11)*(7+f*37)+183;if(x>-130&&x<580)grass(x,y,s,t*.3,P.grass)}}
    bank(549,577,'dry');bank(711,742,'dry');return
  }
  g.fillStyle=gradient(0,306,0,850,[[0,P.water[0]],[.4,P.water[1]],[1,P.water[2]]]);g.fillRect(-240,319,940,650);
  for(let i=0;i<44;i++){const y=332+random(600+i)*498,x=random(360+i)*750-150+wave(t*.65+i)*3;
    line([[x,y],[x+5+(y-330)*.035,y]],mode==='night'?'#d4e0cd30':'#f9ecba68',1.5)}
  for(const x of [-330,-125,95,343,620,850]){const vx=183+(x-183)*.07;
    polygon([[vx,320],[vx+3,320],[x+26,838],[x,838]],P.dike[0]);line([[vx,320],[x,838]],P.dike[1],2)}
  for(let row=0;row<15;row++){const f=row/14,y=326+f*f*540,s=.35+1.7*f;
    for(let j=-5;j<31;j++){const x=(j-11)*(7+f*37)+183+wave(row*19+j)*3;if(x>-130&&x<580)grass(x,y+wave(j*68+row)*2,s,t,P.grass)}}
  if(soil){
    polygon([[-280,472],[710,455],[710,970],[-280,970]],gradient(0,455,0,850,[[0,P.soil[0]],[1,P.soil[1]]]));
    for(let i=0;i<115;i++){const x=random(i+499)*800-180,y=475+random(i+88)*420;ellipse(x,y,random(i+24)*3+1,1,'#3e2c204c')}
  }else{bank(549,577,mode);bank(711,742,mode)}
}
function nightTint(a=.18){g.fillStyle='rgba(14,22,48,'+a+')';g.fillRect(-300,-300,1100,1400)}
const ease=v=>v*v*(3-2*v);

// ---------- Tokoh (gaya Mbah Darmi; nama baru) ----------
// Satu patokan ukuran: semua orang dewasa skala yang sama per adegan; bayi digendong.
const people={
  sapto:{skin:['#ddaa80','#b77d55','#8a5a3c'],shirt:['#8fc4ea','#5f9fd0','#3d77a8'],pants:'#3b4252',kind:'hair',hair:'#2b2420'},
  sumirah:{skin:['#e4b189','#b98262','#8a5c49'],shirt:['#b5577a','#8f3b5c','#662840'],pants:'#5a2a3a',kind:'scarf',scarf:['#7a4fa6','#5c3a86','#3f2660']},
  wiryo:{skin:['#d6a27a','#ad7450','#7f5236'],shirt:['#d9cfb0','#b5a988','#8a7f62'],pants:'#3a3a3a',kind:'elder',cap:['#3a3a3a','#222','#111'],glasses:true},
  joko:{skin:['#d8a37a','#b07552','#845438'],shirt:['#7cc07a','#4f9a4f','#356e36'],pants:'#3b4252',kind:'hair',hair:'#2a2420'},
  bayu:{skin:['#e3ae84','#bd8459','#8f5e3e'],shirt:['#f2a65a','#d9822e','#a65e1a'],pants:'#3b4252',kind:'hair',hair:'#1f1a16',spiky:true},
  lastri:{skin:['#ecbd94','#c99068','#9b6748'],shirt:['#f6d36b','#e2b23e','#b5871c'],pants:'#7a5230',kind:'scarf',scarf:['#f4a9c0','#e07f9e','#b4577a']},
  calon1:{skin:['#e6b58e','#bf8a64','#93644a'],shirt:['#7fb8e8','#4f8fc8','#2f6a9e'],pants:'#2f4a6a',kind:'scarf',scarf:['#f2e2c4','#d9c39c','#ad9670']},
  calon2:{skin:['#e8b98f','#c48c62','#966344'],shirt:['#f29bb8','#d9729a','#a9527a'],pants:'#7a3b5c',kind:'bun',hair:'#2a1f18'},
  calon3:{skin:['#e2ad86','#bb8460','#8e5d42'],shirt:['#9fd39a','#6fb06a','#4a8446'],pants:'#3d5a3a',kind:'scarf',scarf:['#f7d66a','#e0b43a','#a8821c']},
  calon4:{skin:['#e6b58e','#bf8a64','#93644a'],shirt:['#c9a2e0','#a57ac4','#7a5498'],pants:'#4f3a6a',kind:'scarf',scarf:['#8fd3d0','#5fb3b0','#3f8a88']},
  adik:{skin:['#e3ae84','#bd8459','#8f5e3e'],shirt:['#f4f1e8','#dcd6c6','#aca490'],pants:'#2f3540',kind:'hair',hair:'#2a2420'},
  ipar:{skin:['#ecbd94','#c99068','#9b6748'],shirt:['#f6a3c0','#dc7aa0','#a9527a'],pants:'#7a3b5c',kind:'bun',hair:'#2a1f18'},
  ibu1:{skin:['#e4b189','#b48264','#8a5c49'],shirt:['#9e7b93','#79586e','#503f53'],pants:'#503f53',kind:'scarf',scarf:['#e8c25a','#c99f33','#8f6e1c']},
  ibu2:{skin:['#d8ab87','#aa7756','#795440'],shirt:['#6fb3a6','#4a8f82','#2f6a5f'],pants:'#2f4a44',kind:'scarf',scarf:['#f29b8a','#d9776a','#a6544a']},
  ibu3:{skin:['#e6b58e','#bf8a64','#93644a'],shirt:['#f2c26a','#d9a03a','#a8761c'],pants:'#6a4a2a',kind:'bun',hair:'#3a2a20'}
};
let talkGate=0;
function mouthLevel(t){return talkGate*(.3+.7*Math.abs(wave(t*11.3))*(.6+.4*wave(t*4.7)))}
// Benda yang dipegang tangan (digambar di posisi tangan).
function chicken(x,y,s,t,flap=0){
  at(x,y,s,()=>{
    polygon([[-14,-2],[-26,-14],[-24,4]],'#3a6a3a');polygon([[-14,-2],[-30,-6],[-22,8]],'#2f4f7a');
    orb(0,0,18,14,'#f0a54a','#c9752a','#8a4a1a');
    const w=Math.sin(t*20)*flap*6;polygon([[-4,-2],[10,-4-w],[8,8]],'#b5622a');
    orb(14,-12,8,8,'#f0a54a','#c9752a','#8a4a1a');polygon([[21,-12],[28,-10],[21,-8]],'#f2c94a');
    for(let k=0;k<3;k++)ellipse(11+k*3,-21+Math.abs(k-1),2.6,3.6,'#e0392e');ellipse(19,-6,2,3.4,'#e0392e');ellipse(15,-13,1.4,1.4,'#1a1a1a');
    line([[-2,12],[-3,22]],'#e8a43a',2);line([[4,12],[5,22]],'#e8a43a',2)
  })
}
function baby(x,y,s){at(x,y,s,()=>{orb(0,0,20,13,'#cfe6ff','#9ec6ec','#6f9bc8');orb(14,-6,9,9,'#f1c6a0','#d9a47a','#b07a52');curve(11,-6,13,-4,15,-6,'#5a3a2a',1);ellipse(18,-2,1.6,1.2,'#d07a72')})}
function tool(type,hx,hy,t,o){
  if(type==='sapu'){g.save();g.translate(hx,hy);g.rotate(o.toolAngle??.5);line([[0,-34],[0,40]],'#a8823a',3);for(let k=-4;k<=4;k++)line([[0,36],[k*3,62]],'#c9a24a',1.4);g.restore()}
  if(type==='ayam')chicken(hx,hy-6,.9,t,o.flap||0);
  if(type==='bayi')baby(hx-4,hy-6,1);
  if(type==='kalender'){box(hx-34,hy-60,68,74,4,'#f6f1e6','#8a7a5a',1.4);box(hx-34,hy-60,68,14,4,'#c0392b');label('JAWA',hx,hy-53,8,'#fff','center',900);for(let r=0;r<4;r++)for(let c=0;c<5;c++)box(hx-30+c*13,hy-42+r*13,11,11,1,(r*5+c)%7===3?'#f2c94a':'#e8e0cc')}
  if(type==='sarung'){box(hx-24,hy-10,40,26,3,'#3f7a5a');for(let k=0;k<4;k++)line([[hx-24,hy-6+k*6],[hx+16,hy-6+k*6]],'#2a5a40',1.4)}
  if(type==='sandal'){ellipse(hx+6,hy+4,12,5,'#3a3a3a',.3);line([[hx,hy+3],[hx+10,hy]],'#e0473a',2)}
}
function person(id,x,y,s,t,o={}){
  const p=people[id],mood=o.mood||'calm',dir=o.dir??0;
  const moving=o.walk||0,crouch=o.crouch||0,talk=o.talk?mouthLevel(t):0;
  const seed=id.length+id.charCodeAt(0)*.13;
  at(x,y,s,()=>{
    if(!o.sit)ellipse(0,1,31,5,'#27372835');
    const stride=wave(t*5.4)*moving;
    let shift=1.25*wave(t*2+seed)+17*crouch;if(o.sit)shift=40;
    for(const side of [-1,1]){
      if(o.sit){line([[side*8,-54+shift],[side*6+30,-12],[side*6+32,22]],p.pants,7.4);orb(side*6+35,23,7.5,4.6,'#5a4a3a','#3a2f26','#221a14');continue}
      const ankle=side*(11+stride*9);

function draw(){const t=Math.min(now(),DURATION),[i]=paintAt(t);if(i!==lastLine){$('#section').textContent=(i+1)+'. '+SCRIPT[i][0].slice(0,34)+(SCRIPT[i][0].length>34?'…':'');lastLine=i}seek.value=t;$('#now').textContent=timeLabel(t);if(t>=DURATION&&playing&&!useAudio){playing=false;base=DURATION;buttonState()}}
function tick(){frameId=0;draw();if(useAudio?!voice.paused:playing)frameId=requestAnimationFrame(tick)}
function buttonState(){const on=useAudio?!voice.paused:playing;$('#play').textContent=on?'Ⅱ':'▶';$('#play').setAttribute('aria-label',on?'Jeda':'Putar')}
function play(){if(useAudio){voice.play();return}if(base>=DURATION)base=0;startedAt=performance.now();playing=true;buttonState();if(!frameId)frameId=requestAnimationFrame(tick)}
function pause(){if(useAudio){voice.pause();return}base=now();playing=false;buttonState()}
$('#play').addEventListener('click',()=>{(useAudio?!voice.paused:playing)?pause():play()});
seek.addEventListener('input',()=>{const v=Number(seek.value);if(useAudio)voice.currentTime=v;else{base=v;startedAt=performance.now()}draw()});
voice.addEventListener('play',()=>{buttonState();if(!frameId)frameId=requestAnimationFrame(tick)});voice.addEventListener('pause',buttonState);
seek.max=DURATION;$('#end').textContent=timeLabel(DURATION);
function resize(){const w=Math.min(1080,Math.max(360,Math.round(canvas.getBoundingClientRect().width*Math.min(devicePixelRatio||1,2))));if(canvas.width!==w){canvas.width=w;canvas.height=Math.round(w*H/W)}draw()}
window.addEventListener('resize',resize);resize();buttonState();
window.SAKA={duration:DURATION,lines:LINES,get audio(){return audioEvents()},frame(t,w){if(w&&canvas.width!==w){canvas.width=w;canvas.height=Math.round(w*H/W)}paintAt(t);return canvas.toDataURL('image/jpeg',.96)}};
</script>
</body></html>
